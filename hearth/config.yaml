name: Hearth
version: "0.3.0"
slug: hearth
description: Family wall calendar, chores, lists, meal plan, and photo frame for wall-mounted tablets
url: https://github.com/slinky34/hearth-ha
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:calendar-heart
panel_title: Hearth
homeassistant_api: true
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct access for kiosk tablets (no HA login). Leave empty unless you need it.
options:
  photo_directory: /media/hearth
schema:
  photo_directory: str
