configuration:
  photo_directory:
    name: Photo folder
    description: >-
      Folder Hearth shows photos from, including subfolders. Must be inside /media or /share,
      for example /media/Photos/Family or /share/photos. Uploads from Hearth go here too.
  mealie_url:
    name: Mealie address (optional)
    description: >-
      Your Mealie server, e.g. http://192.168.1.20:9000. Only used to show recipe photos;
      recipes themselves come from Home Assistant's Mealie integration.
  bar_assistant_url:
    name: Bar Assistant address (optional)
    description: >-
      Your Bar Assistant server for cocktail recipes, e.g. http://192.168.1.20:3000
      (the API address; Hearth adds /api if it's missing).
  bar_assistant_token:
    name: Bar Assistant API token
    description: A personal access token from Bar Assistant (Settings → Personal access tokens).
  bar_assistant_bar_id:
    name: Bar ID (optional)
    description: Which bar to use if you have several. Leave empty to use the first one.
  immich_url:
    name: Immich address (optional)
    description: Your Immich server for photos, e.g. http://192.168.1.20:2283. Pick albums in Hearth under Settings → Photos.
  immich_api_key:
    name: Immich API key
    description: Create one in Immich under Account settings → API keys.
  frigate_url:
    name: Frigate address (optional)
    description: >-
      For the recent-detections feed. Use Frigate's internal port, e.g. http://ccab4aaf-frigate:5000
      for the Frigate add-on, or http://192.168.1.20:5000. Live camera views work without this.
