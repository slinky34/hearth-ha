configuration:
  photo_directory:
    name: Photo folder
    description: >-
      Folder Hearth shows photos from, including subfolders. Must be inside /media or /share,
      for example /media/Photos/Family or /share/photos. Uploads from Hearth go here too.
  mealie_url:
    name: Mealie address (optional)
    description: >-
      Your Mealie server, e.g. http://192.168.1.20:9000. Only used to show recipe photos;
      recipes themselves come from Home Assistant's Mealie integration.
